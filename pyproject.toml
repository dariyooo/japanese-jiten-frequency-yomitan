[project]
name = "japanese-jiten-frequency-yomitan"
version = "0.1.0"
description = "Jiten's word and kanji frequency lists for Yomitan and DaKanji"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dalang-dict-utils",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.uv.sources]
dalang-dict-utils = { git = "https://github.com/dariyooo/dalang-dict-authoring", tag = "v0.4.2" }

[tool.ruff]
line-length = 120
target-version = "py312"
# Vendored third-party code stays as it was copied
extend-exclude = ["vendored_sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["build.py", "japanese_jiten_frequency", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
